name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A push that doesn't change the version has nothing to publish: its release exists already.
      - name: Check for this version's release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version javascript/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is released already; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.exists == 'false'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - if: steps.version.outputs.exists == 'false'
        run: ./scripts/install-binaryen.sh
      - if: steps.version.outputs.exists == 'false'
        run: ./scripts/build-wasm.sh
      - name: Create release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.version.outputs.version }}
          # if [ "${version%%.*}" = "0" ]; then
          #   echo "Version $version is major 0; skipping release."
          #   exit 0
          # fi
          tarball=$(cd javascript && npm pack --silent)
          gh release create "v$version" javascript/kernel.wasm javascript/kernel.sha256 "javascript/$tarball" \
            --target "$GITHUB_SHA" --generate-notes
