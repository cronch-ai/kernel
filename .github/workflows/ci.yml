name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  rust:
    needs: biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - run: cargo test --workspace
      - run: ./scripts/install-binaryen.sh
      - run: ./scripts/build-wasm.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test --prefix javascript
