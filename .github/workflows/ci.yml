name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  biome:
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  rust:
    needs: biome
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - run: cargo test --workspace
      - run: ./scripts/install-binaryen.sh
      - run: ./scripts/build-wasm.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test --prefix javascript
      - run: ./scripts/install-proof-tools.sh
      - run: ./scripts/install-lean.sh
      - run: ../.proof-tools/lean/bin/lake build
        working-directory: lean
      # Lake's comparator builds a solution in a bwrap sandbox, which needs a user namespace, and the runner
      # can't make one. So the proofs run in a container that can, seeing the runner's whole work directory
      # (this checkout and setup-node's node) at the same paths.
      - run: |
          work="$(dirname "$RUNNER_WORKSPACE")"
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$work:$work" -w "$PWD" \
            -e PATH="$(dirname "$(command -v node)"):/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            ubuntu:24.04 \
            sh -c 'apt-get update -qq && apt-get install -y -qq bubblewrap >/dev/null && npm run test:proofs'
